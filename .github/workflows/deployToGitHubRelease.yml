name: Deploy to GitHub Release
on:
  workflow_call:
    inputs:
      run_id:
        description: 'The id of the workflow we want to download the artifact from'
        required: true
        type: string
      artifactName:
        description: 'The name of the build artifact to include in the release (e.g., Build-WebGL).'
        required: true
        type: string
      zipName:
        description: 'The name of the zip file to create from the build artifacts (e.g., release-assets.zip).'
        required: true
        type: string
      tagName:
        description: 'The tag name for the release (e.g., v1.0.0).'
        required: true
        type: string
      note:
        description: 'Release notes for the GitHub release.'
        required: false
        type: string
      prerelease:
        description: 'Set to "true" to mark this release as a pre-release. Default is "true".'
        default: true
        required: false
        type: boolean

  workflow_dispatch:
    inputs:
      run_id:
        description: 'The id of the workflow we want to download the artifact from'
        required: true
        type: string
      artifactName:
        description: 'The name of the build artifact to include in the release (e.g., Build-WebGL).'
        required: true
        type: string
      zipName:
        description: 'The name of the zip file to create from the build artifacts (e.g., release-assets.zip).'
        required: true
        type: string
      tagName:
        description: 'The tag name for the release (e.g., v1.0.0).'
        required: true
        type: string
      note:
        description: 'Release notes for the GitHub release.'
        required: false
        type: string
      prerelease:
        description: 'Set to "true" to mark this release as a pre-release. Default is "true".'
        default: true
        required: false
        type: boolean

jobs:
  create_release:
    # Runs the job on the latest Ubuntu version
    runs-on: ubuntu-latest

    steps:
      # Checks out a copy of your repository
      # - name: Checkout code
      #   uses: actions/checkout@v2

      # gets build artifacts
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifactName }}
          path: build/${{ inputs.artifactName }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # zips the build artifacts
      - name: Zip Build Artifacts
        run: |
          cd build
          if [ -d "${{ inputs.artifactName }}" ]; then
            zip -r ${{ inputs.zipName }} ${{ inputs.artifactName }}
            sudo chmod u+x ${{ inputs.zipName }}
            sudo chmod g+x ${{ inputs.zipName }}
            sudo chmod o+x ${{ inputs.zipName }}
            ls -la
          else
            echo "Error: Directory ${{ inputs.artifactName }} not found in build/"
            ls -la
            exit 1
          fi
      
      # Checks if zip files still exist
      - name: Verify Zip File
        run: |
          ls build/
          ls -la build/

      - name: GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          body: ${{ inputs.note }}
          prerelease: ${{ inputs.prerelease }}
          files: build/${{inputs.zipName}}
          tag_name: ${{ inputs.tagName }}